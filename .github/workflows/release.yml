name: Release

# Se déclenche à chaque tag de version poussé (ex. v1.0.0, v1.2.3).
on:
  push:
    tags:
      - "v*"

# Autorise le workflow à créer la Release et y attacher des fichiers.
permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,     name: macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      name: macos-intel }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x86_64 }

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Rust (+ cible)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache des dépendances
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Le tag Git est la seule source de vérité pour la version : on la réinjecte
      # dans Cargo.toml avant de compiler. Ainsi le binaire rapporte toujours la
      # même version que la release, ce qui évite toute désynchronisation (bannière
      # et vérification de mise à jour restent exactes).
      - name: Synchroniser la version sur le tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Version dérivée du tag : $VERSION"
          awk -v v="$VERSION" '!done && /^version = /{print "version = \"" v "\""; done=1; next} {print}' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          grep '^version' Cargo.toml

      - name: Compiler en release
        run: cargo build --release --target ${{ matrix.target }}

      # Le nom de l'asset contient le « target triple » (ex. aarch64-apple-darwin)
      # pour que `self_update` sélectionne automatiquement le bon fichier, et le
      # binaire est placé à la racine de l'archive pour qu'il soit trouvé.
      - name: Empaqueter (macOS / Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          dir="serve-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/serve" "$dir/"
          cp README.md LICENSE "$dir/"
          tar -C "$dir" -czf "$dir.tar.gz" .
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Empaqueter (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          dir="serve-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/serve.exe" "$dir/"
          cp README.md LICENSE "$dir/"
          ( cd "$dir" && 7z a "../$dir.zip" . )
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Publier sur la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
