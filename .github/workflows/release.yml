name: Release

# Se déclenche à chaque tag de version poussé (ex. v1.0.0, v1.2.3).
on:
  push:
    tags:
      - "v*"

# Autorise le workflow à créer la Release et y attacher des fichiers.
permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,     name: macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      name: macos-intel }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x86_64 }

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Rust (+ cible)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache des dépendances
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compiler en release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empaqueter (macOS / Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          dir="serve-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/serve" "$dir/"
          cp README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Empaqueter (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          dir="serve-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/serve.exe" "$dir/"
          cp README.md LICENSE "$dir/"
          7z a "$dir.zip" "$dir"
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Publier sur la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
